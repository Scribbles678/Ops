# TEMPLATE. Never commit a real password; this file is not in kustomization.yaml.
#
# Create the real Secret once, with the password the app's DATABASE_URL will use:
#
#   kubectl -n ns-operations-scheduler create secret generic scheduling-postgres \
#     --from-literal=POSTGRES_PASSWORD='<a strong password>'
#
# Postgres reads it only when it creates a new, empty data directory. Changing it
# afterwards does not change the database's password. That takes ALTER USER.
apiVersion: v1
kind: Secret
metadata:
  name: scheduling-postgres
  namespace: ns-operations-scheduler
type: Opaque
stringData:
  POSTGRES_PASSWORD: CHANGE-ME
